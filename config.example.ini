# =====================================================================
#  Telegram PC Assistant — configuration template
#  install.bat copies this to config.ini on first run.
#
#  Optional: put your bot token in token.txt next to install.bat.
#  token.txt is plaintext and must be kept private; it is never packaged.
#  Priority: token.txt > TELEGRAM_BOT_TOKEN > per-user token store > prompt.
# =====================================================================

[telegram]

# YOUR numeric Telegram user id (the only account allowed to command the bot).
# Get it by messaging @userinfobot, or start the bot and use /id.
# Several people? Separate with commas:   7823157087, 111111111
allowed_user_ids = 7823157087

# Approvers must also be in allowed_user_ids. Empty = all allowed IDs.
# To require a different person to approve: list at least two allowed IDs,
# choose approvers from that list, and set require_distinct_approver = true.
approver_user_ids =
require_distinct_approver = false

# Legacy bot_token values in this file are ignored. Use token.txt, the
# TELEGRAM_BOT_TOKEN environment variable, or the protected token store.
bot_token =

[planner]

# Which planner turns your text into actions:
#   cloud    - free, no API key: https://text.pollinations.ai/openai
#              Requires approval before request/context leave the PC.
#   local    - Ollama on this machine, fully offline
#   keywords - no model at all, deterministic Arabic/English patterns
# Fallback order is always: cloud → local (if running) → keywords.
mode = cloud

# Cloud backend (OpenAI-compatible, key-less). Only used when mode = cloud.
cloud_url = https://text.pollinations.ai/openai
cloud_model = openai
# Seconds to wait for the cloud planner before falling back.
cloud_timeout = 45
# After an HTTP 429 (rate limit) the cloud planner is skipped for this long.
cloud_cooldown_seconds = 120
# Ask the endpoint for strict JSON mode ({"type": "json_object"}). If the
# service rejects it, the assistant retries once without it automatically.
cloud_response_format = true

[ollama]

# Local model backend, used when mode = local, or as the middle fallback.
# Install: https://ollama.com/download   then:  ollama pull qwen2.5:3b
use_ollama = true
base_url = http://127.0.0.1:11434
# Small models that work well on a normal PC and understand Arabic:
#   qwen2.5:3b   (recommended: good at Arabic + JSON, ~2 GB)
#   llama3.2:3b  (~2 GB, English-leaning)
#   qwen2.5:1.5b (fastest, weaker)
model = qwen2.5:3b
# Seconds to wait for the model before falling back to the keyword planner.
timeout = 90

[behaviour]

# Max seconds a PowerShell command may run before it is killed.
command_timeout = 60
# Output sent back to Telegram is cut at this many characters.
max_output_chars = 3500
# Refuse to read files bigger than this (KB).
max_file_read_kb = 200
# Maximum transfer size in MB (Telegram itself may have lower limits).
max_send_file_mb = 45
# Additional process names that kill_process must refuse, comma-separated.
protected_processes =
# Hard cap on how many steps one plan may contain (1-6).
max_plan_steps = 6
# true  -> screenshots arrive as a file (full quality, tap to open)
# false -> screenshots arrive as a compressed photo preview
screenshot_as_document = true
# Extra guard: refuse any PowerShell command containing one of these
# substrings (case-insensitive, comma separated). Leave empty for none.
# Example:  blocked_patterns = format-volume, diskpart, cipher /w
blocked_patterns =
# DEBUG, INFO, WARNING
log_level = INFO

[paths]

# Folder the assistant treats as "current directory" for relative paths and
# as the default target of "list files". "." = the folder with main.py.
workspace_root = .

# Optional extra safety: if set, file actions are only allowed inside these
# folders (comma separated). Empty = no restriction for normal file actions;
# send_file, receive_file and find_files default to workspace_root regardless.
# Example: allowed_roots = C:\Users\Me\Documents, C:\Users\Me\Desktop
allowed_roots =

# Where to write the audit log (rotated at 2 MB, 5 backups kept).
log_file = logs/assistant.log

# Where screenshots are stored locally.
screenshots_dir = screenshots

# Keep the screenshot files after sending them to Telegram?
keep_screenshots = true

# Uploaded Telegram documents go here after confirmation. This folder must be
# inside allowed_roots, or workspace_root if allowed_roots is empty.
downloads_dir = downloads
# Persistent reminders and scheduled commands (protect this file from editing).
jobs_file = data/jobs.json

[voice]
# Optional offline faster-whisper model directory. See README for installation.
# The program never downloads a voice model automatically.
model_path = models/faster-whisper-tiny
