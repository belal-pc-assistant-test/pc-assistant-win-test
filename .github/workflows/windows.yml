name: windows-test
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System info
        shell: pwsh
        run: |
          python --version
          [System.Environment]::OSVersion | Format-List
      - name: Install deps and run unit tests
        shell: cmd
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q -p no:cacheprovider --tb=short
      - name: Debug actions on Windows
        shell: cmd
        continue-on-error: true
        run: |
          python tests\ci_debug_actions.py
      - name: Dry run install.bat (no token)
        shell: cmd
        continue-on-error: true
        run: |
          install.bat < NUL
          echo install.bat exit code %ERRORLEVEL%
      - name: Self check
        shell: cmd
        continue-on-error: true
        run: |
          .venv\Scripts\python.exe main.py --check
      - name: Dry run plan (no execution)
        shell: cmd
        continue-on-error: true
        run: |
          .venv\Scripts\python.exe tests\ci_run_main.py --plan "show system info"
      - name: Real Telegram API check and short bot run
        shell: pwsh
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if (-not $env:BOT_TOKEN) { Write-Host "no token secret"; exit 0 }
          $me = Invoke-RestMethod "https://api.telegram.org/bot$env:BOT_TOKEN/getMe"
          Write-Host "getMe ok: $($me.ok) username: $($me.result.username)"
          [IO.File]::WriteAllText("$PWD\token.txt", $env:BOT_TOKEN)
          $p = Start-Process -FilePath ".venv\Scripts\python.exe" -ArgumentList "tests\ci_run_main.py","--no-token-prompt" -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru -NoNewWindow
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          Write-Host "bot still running after 30s: $alive"
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Write-Host "---- stdout (masked)"; (Get-Content out.txt -ErrorAction SilentlyContinue) -replace '\d{8,10}:[A-Za-z0-9_-]{35}','***' | Select-Object -Last 30
          Write-Host "---- stderr (masked)"; (Get-Content err.txt -ErrorAction SilentlyContinue) -replace '\d{8,10}:[A-Za-z0-9_-]{35}','***' | Select-Object -Last 30
          Remove-Item token.txt -Force
