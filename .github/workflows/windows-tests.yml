name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt pyflakes
      - name: Static check
        run: python -m pyflakes main.py assistant tests build_zip.py
      - name: Windows-only tests
        run: python -m unittest discover -s tests -p "test_windows_real.py" -v
      - name: Full suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
